<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防災マップ</title>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; background-color: #eef0f4; touch-action: none; }
        
        #top-menu { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100px; 
            background: #2c3e50; padding: 0 20px; display: flex; gap: 12px; 
            box-sizing: border-box; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            align-items: center; overflow-x: auto; 
        }
        
        .menu-btn { background: transparent; border: 2px solid white; color: white; padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 25px; white-space: nowrap; transition: 0.3s; }
        .menu-btn.active { background: white; color: #2c3e50; font-weight: bold; }
        
        .school-title {
            display: flex; align-items: center; gap: 12px; color: white;
            font-family: "DNP 秀英丸ゴシック Std", "DNP Shuei MaruGo Std", sans-serif;
            font-size: 24px; font-weight: bold; white-space: nowrap;
            position: absolute; left: 50%; transform: translateX(-50%);
            -webkit-user-select: none; user-select: none;
        }

        .school-logo { height: 50px; object-fit: contain; pointer-events: none; }
        .header-banner { height: 80px; margin-left: auto; object-fit: contain; pointer-events: none; }
        #arrow-btn { margin-left: 15px; font-weight: bold; font-size: 18px; padding: 10px 20px; border-radius: 25px; }

        #map-container { width: 100%; height: 100%; padding-top: 100px; box-sizing: border-box; overflow: hidden; position: relative; }
        #map-content { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; transform-origin: center center; }

        #map-image { 
            max-width: 45%; max-height: 85%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 8px; 
            cursor: grab; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }
        #map-image:active { cursor: grabbing; }
        
        .ui-panel { position: absolute; z-index: 5; pointer-events: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .legend-panel { left: 8vw; top: 50%; transform: translateY(-50%); width: 22vw; max-width: 300px; min-width: 220px; }
        .evacuate-panel { right: 8vw; top: 50%; transform: translateY(-50%); width: 22vw; max-width: 300px; min-width: 220px; }

        #floor-menu { position: absolute; bottom: 30px; left: 40px; display: flex; flex-direction: column-reverse; gap: 15px; z-index: 10; }
        .floor-btn { background: white; border: 2px solid #333; color: #333; width: 65px; height: 65px; font-size: 22px; font-weight: bold; cursor: pointer; border-radius: 50%; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .floor-btn.active { background: #2c3e50; border-color: #2c3e50; color: white; }

        #zoom-controls { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        .zoom-btn { background: white; border: 1px solid #666; color: #333; width: 50px; height: 50px; font-size: 24px; font-weight: normal; cursor: pointer; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .zoom-btn:active { background: #e0e0e0; }
        .reset-btn { font-size: 11px; height: 50px; line-height: normal; padding: 0; }

        @media screen and (max-width: 768px) {
            #top-menu { height: 60px; padding: 0 10px; gap: 8px; }
            .menu-btn { padding: 6px 12px; font-size: 13px; }
            #arrow-btn { font-size: 13px; padding: 6px 12px; }
            .school-title, .header-banner { display: none; }
            #map-container { padding-top: 60px; }
            #map-image { max-width: 90%; max-height: 80%; }
            .ui-panel { display: none; }
            #floor-menu { bottom: 20px; left: 20px; gap: 10px; }
            .floor-btn { width: 50px; height: 50px; font-size: 18px; }
            #zoom-controls { bottom: 20px; right: 20px; gap: 6px; }
            .zoom-btn { width: 42px; height: 42px; font-size: 20px; }
            .reset-btn { height: 42px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <div id="top-menu">
        <button class="menu-btn active" onclick="selectBuilding('全体図')">校内全体図</button>
        <button class="menu-btn" onclick="selectBuilding('1号館')">1号館</button>
        <button class="menu-btn" onclick="selectBuilding('2号館')">2号館</button>
        <button class="menu-btn" onclick="selectBuilding('3号館')">3号館</button>
        <button class="menu-btn" onclick="selectBuilding('4号館')">4号館</button>
        <button class="menu-btn" onclick="selectBuilding('体育館')">体育館</button>
        
        <div class="school-title">
            <img src="images/ロゴ.png" class="school-logo" alt="学校ロゴ" onerror="this.style.display='none'">
            <span>〇〇〇〇〇〇〇高等学校避難マップ</span>
        </div>
        
        <img src="images/メッセージ.png" class="header-banner" alt="正しい避難を心がけましょう" onerror="this.style.display='none'">
        <button id="arrow-btn" class="menu-btn" onclick="toggleArrow()">避難経路: OFF</button>
    </div>

    <div id="map-container">
        <div id="map-content">
            <img src="images/凡例.png" class="ui-panel legend-panel" alt="凡例" onerror="this.style.display='none'">
            <img id="map-image" src="images/全体図.png" alt="防災マップ" onerror="this.src='https://placehold.jp/800x600.png?text=画像準備中';">
            <img src="images/避難のしかた.png" class="ui-panel evacuate-panel" alt="避難のしかた" onerror="this.style.display='none'">
        </div>
    </div>

    <div id="floor-menu"></div>

    <!-- ズーム率の刻みを 0.2 に変更 -->
    <div id="zoom-controls">
        <button class="zoom-btn" onclick="zoomMap(0.2)">＋</button>
        <button class="zoom-btn" onclick="zoomMap(-0.2)">－</button>
        <button class="zoom-btn reset-btn" onclick="resetZoom()">リセット</button>
    </div>

    <script>
        const mapData = {
            '全体図': ['1F'],
            '1号館': ['1F', '2F'],
            '2号館': ['1F', '2F', '3F'],
            '3号館': ['1F', '2F', '3F'],
            '4号館': ['1F', '2F', '3F', '4F'],
            '体育館': ['1F', '2F']
        };

        let currentBuilding = '全体図';
        let currentFloor = '1F';
        let showArrow = false; 
        
        let currentScale = 1;
        let translateX = 0;
        let translateY = 0;

        function selectBuilding(building) {
            currentBuilding = building;
            currentFloor = mapData[building][0]; 
            updateUI();
        }

        function selectFloor(floor) {
            currentFloor = floor;
            updateUI();
        }

        function toggleArrow() {
            showArrow = !showArrow;
            updateUI();
        }

        function updateTransform() {
            document.getElementById('map-content').style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
        }

        function zoomMap(step) {
            currentScale += step;
            if(currentScale < 0.5) currentScale = 0.5; 
            if(currentScale > 4.0) currentScale = 4.0; 
            updateTransform();
        }

        function resetZoom() {
            currentScale = 1;
            translateX = 0; 
            translateY = 0;
            updateTransform();
        }

        const mapContainer = document.getElementById('map-container');
        const mapImage = document.getElementById('map-image');
        let isDragging = false;
        let startX = 0, startY = 0;

        // ピンチ操作用変数
        let initialDistance = null;
        let initialScale = 1;

        function getDistance(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function startDrag(e) {
            if (e.type.includes('touch')) {
                if (e.touches.length === 2) {
                    // 2本指タッチ開始（ピンチズーム）
                    isDragging = false;
                    initialDistance = getDistance(e.touches[0], e.touches[1]);
                    initialScale = currentScale;
                    return;
                } else if (e.touches.length === 1) {
                    if (e.target !== mapImage) return;
                    isDragging = true;
                    startX = e.touches[0].clientX - translateX;
                    startY = e.touches[0].clientY - translateY;
                }
            } else {
                if (e.target !== mapImage) return;
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
            }
        }

        function onDrag(e) {
            if (e.type.includes('touch') && e.touches.length === 2) {
                // 2本指でピンチ操作中
                e.preventDefault();
                if (initialDistance === null) return;
                const currentDistance = getDistance(e.touches[0], e.touches[1]);
                const scaleFactor = currentDistance / initialDistance;
                currentScale = Math.min(Math.max(initialScale * scaleFactor, 0.5), 4.0);
                updateTransform();
                return;
            }

            if (!isDragging) return;
            e.preventDefault(); 
            
            let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            translateX = clientX - startX;
            translateY = clientY - startY;
            updateTransform();
        }

        function endDrag(e) {
            if (e.type.includes('touch') && e.touches.length < 2) {
                initialDistance = null;
            }
            if (e.type.includes('touch') && e.touches.length === 0) {
                isDragging = false;
            } else if (!e.type.includes('touch')) {
                isDragging = false;
            }
        }

        mapContainer.addEventListener('mousedown', startDrag);
        mapContainer.addEventListener('mousemove', onDrag);
        mapContainer.addEventListener('mouseup', endDrag);
        mapContainer.addEventListener('mouseleave', endDrag); 

        mapContainer.addEventListener('touchstart', startDrag, { passive: false });
        mapContainer.addEventListener('touchmove', onDrag, { passive: false });
        mapContainer.addEventListener('touchend', endDrag);

        mapImage.addEventListener('dblclick', function(e) {
            zoomMap(0.2); 
        });

        function updateUI() {
            document.querySelectorAll('.menu-btn:not(#arrow-btn)').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(currentBuilding)) btn.classList.add('active');
            });

            const arrowBtn = document.getElementById('arrow-btn');
            if(showArrow) {
                arrowBtn.innerText = '避難経路: ON';
                arrowBtn.style.backgroundColor = '#27ae60'; 
                arrowBtn.style.borderColor = '#27ae60';
                arrowBtn.style.color = 'white';
            } else {
                arrowBtn.innerText = '避難経路: OFF';
                arrowBtn.style.backgroundColor = 'transparent'; 
                arrowBtn.style.borderColor = 'white';
                arrowBtn.style.color = 'white';
            }

            const floorMenu = document.getElementById('floor-menu');
            floorMenu.innerHTML = '';
            
            if(mapData[currentBuilding].length <= 1) {
                floorMenu.style.display = 'none';
            } else {
                floorMenu.style.display = 'flex';
                mapData[currentBuilding].forEach(floor => {
                    const btn = document.createElement('button');
                    btn.className = 'floor-btn' + (floor === currentFloor ? ' active' : '');
                    btn.innerText = floor;
                    btn.onclick = () => selectFloor(floor);
                    floorMenu.appendChild(btn);
                });
            }

            const img = document.getElementById('map-image');
            const arrowSuffix = showArrow ? '_矢印' : ''; 

            if(currentBuilding === '全体図') {
                img.src = `images/全体図${arrowSuffix}.png`;
            } else {
                img.src = `images/${currentBuilding}_${currentFloor}${arrowSuffix}.png`;
            }
            
            resetZoom();
        }

        mapImage.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        mapImage.addEventListener('dragstart', function(e) { e.preventDefault(); });

        updateUI();
    </script>
</body>
</html>
